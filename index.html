<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <title>馬的！數獨</title>

    <!-- 🔗 社群分享連結預覽標籤 (Open Graph) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://jenny154.github.io/sudoku-game/">
    <meta property="og:title" content="🤬 馬的！數獨">
    <meta property="og:description" content="清華高材生專用數獨！敢來挑戰嗎？每過一分鐘還會偷走你的答案或丟炸彈喔 ^_^">
    <meta property="og:image" content="https://api.iconify.design/twemoji:clown-face.svg">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🤬 馬的！數獨</h1>

        <!-- 計時器與惡意計量條 -->
        <div class="header-info">
            <div id="timer" class="timer">⏳ 耗時：00:00</div>
            <div class="steal-container">
                <span class="steal-icon">👎</span>
                <div class="steal-bar-bg">
                    <div id="steal-bar" class="steal-bar-fill"></div>
                </div>
            </div>
        </div>

        <!-- 選擇難度與關卡 -->
        <div class="controls">
            <div class="control-group">
                <label for="difficulty">難度：</label>
                <select id="difficulty" onchange="loadLevelList()">
                    <option value="easy">簡單 (Easy)</option>
                    <option value="medium">中等 (Medium)</option>
                    <option value="hard">困難 (Hard)</option>
                </select>
            </div>
            <div class="control-group">
                <label for="level">關卡：</label>
                <select id="level" onchange="startLevel()">
                    <!-- 動態生成 1~10 關 -->
                </select>
            </div>
        </div>

        <!-- 狀態與功能按鈕 -->
        <div class="action-bar">
            <button class="btn btn-reset" onclick="startLevel()">重來</button>
            <button class="btn btn-peek" onclick="peekAnswer()">偷看 1 秒</button>
            <button class="btn btn-check" onclick="checkAnswer()">公布答案</button>
        </div>

        <!-- 數獨棋盤（加載炸彈與閃現提示） -->
        <div class="board-wrapper">
            <div id="sudoku-board" class="board"></div>
            <div id="peek-banner" class="peek-banner hidden">👀 偷看 1 秒中...記住了沒！</div>
            <div id="bomb-overlay" class="bomb-overlay hidden">
                <div class="bomb">💣</div>
                <div class="explosion">💥</div>
            </div>
        </div>

        <!-- 分離式的雙模式按鈕 -->
        <div class="mode-buttons">
            <button id="btn-mode-answer" class="btn-mode-tab active" onclick="setMode('answer')">
                ✍️ 正式答案
            </button>
            <button id="btn-mode-note" class="btn-mode-tab" onclick="setMode('note')">
                ✏️ 候選筆記
            </button>
        </div>

        <!-- 數字鍵盤 -->
        <div class="numpad">
            <button onclick="inputNumber(1)">1</button>
            <button onclick="inputNumber(2)">2</button>
            <button onclick="inputNumber(3)">3</button>
            <button onclick="inputNumber(4)">4</button>
            <button onclick="inputNumber(5)">5</button>
            <button onclick="inputNumber(6)">6</button>
            <button onclick="inputNumber(7)">7</button>
            <button onclick="inputNumber(8)">8</button>
            <button onclick="inputNumber(9)">9</button>
            <button onclick="inputNumber(0)" class="btn-clear">清除</button>
        </div>
    </div>

    <!-- 破關驚喜彈窗 -->
    <div id="win-modal" class="modal hidden">
        <div class="modal-content">
            <div id="box-container" onclick="openBox()">
                <div class="gift-box">🎁</div>
                <div class="box-hint">點擊箱子領取獎勵</div>
            </div>
            <div id="win-reward" class="hidden">
                <div class="clown-container">
                    <div class="clown-emoji">🤡🖕</div>
                </div>
                <h2>WTF 你真的過關了？</h2>
                <p id="win-message">不愧是清華的餒！智商超越全國 5% 智障 ^_^</p>
                <button class="btn btn-check" onclick="closeWinModal()">繼續嘲諷</button>
            </div>
        </div>
    </div>

    <!-- 滿版黑色投影幕小偷彈窗 -->
    <div id="curtain-modal" class="curtain-overlay hidden">
        <div class="curtain-screen">
            <div class="thief-icon">🥷</div>
            <h2>⏱️ 時間拉下投影幕！</h2>
            <p>你想得太久了，小偷順手牽羊拿走你一個答案！</p>
            <button class="btn btn-check" onclick="dismissCurtainModal()">可惡的偷竊狂...還給我！</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
